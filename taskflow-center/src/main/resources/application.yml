server:
  port: 8081
spring:
  application:
    name: taskflow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/taskflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    password: jinjian20010210
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================
# 任务执行引擎
# ============================================================
taskflow:
  # local = 内存多级流水线引擎（默认）；后续可切 mq
  engine: local
  pipeline:
    # 骨架自测：启动时灌入 5 个假 taskId（DB 里不存在）验证队列流转
    # ⚠️ 已接入真实提交链路，必须保持 false——否则假 taskId 会让真实 handler 查库失败
    self-test: false
